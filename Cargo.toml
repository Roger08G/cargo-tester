[package]
name = "cargo-tester"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A Cargo subcommand for structured, timed, and detailed Rust test reports"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Roger08G/cargo-tester"
homepage = "https://github.com/Roger08G/cargo-tester"
documentation = "https://docs.rs/cargo-tester"
keywords = ["cargo", "cli", "testing", "test-runner", "reporting"]
categories = ["command-line-utilities", "development-tools::testing"]

[features]
demo-failures = []

[dependencies]
anyhow = "1"
atomic-write-file = "0.3"
command-group = "5"
comfy-table = "~7.1"
ctrlc = { version = "3.5", features = ["termination"] }
fs2 = "0.4"
globset = "0.4"
humantime = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
