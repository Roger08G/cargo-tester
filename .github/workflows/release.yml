name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable ${{ matrix.target }}
          rustup default stable

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $tag = "${{ github.ref_name }}"
          $name = "cargo-tester-$tag-$target"
          $extension = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          $source = Join-Path "target/$target/release" "cargo-tester$extension"
          $staging = Join-Path "dist" $name

          New-Item -ItemType Directory -Force -Path $staging, "artifacts" | Out-Null
          Copy-Item $source (Join-Path $staging "cargo-tester$extension")
          Copy-Item "LICENSE" (Join-Path $staging "LICENSE")
          Copy-Item "README.md" (Join-Path $staging "README.md")

          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "$staging/*" -DestinationPath "artifacts/$name.zip"
          } else {
            tar -czf "artifacts/$name.tar.gz" -C $staging .
          }

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Validate tag version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$version" >&2
            exit 1
          }

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum cargo-tester-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
          fi
